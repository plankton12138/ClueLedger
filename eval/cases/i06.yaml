version: 1
cases:
  - id: i06_expand_three_directions
    title: 只读展开必须给出多种方向、代价与待确认问题
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    steps:
      - text: 展开这条灵感：给出至少三种不同的用法方向，每种写清代价和影响，再列出需要我确认的问题。不要修改任何文件。
        purpose: expand_idea
        idea_references: [老板娘的旧识]
        checks:
          - {id: selected, kind: idea_contains, value: 老板娘认识死者}
          - id: read_only_tools
            kind: tool_not_called
            value: "write_file,edit_file,delete_file,move_file,save_idea,search_ideas"
          - id: directions
            kind: manual
            rubric: 给出至少三种互不重复的方向，每种说明代价或影响；列出待确认问题；明确这是讨论而不是已经写进正文。

  - id: i06_expand_asks_for_write
    title: 只读展开被要求改正文时说明能力边界
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    steps:
      - text: 别讨论了，直接把第七章改成老板娘承认自己认识死者。只改第七章。
        purpose: expand_idea
        idea_references: [老板娘的旧识]
        checks:
          - id: read_only_tools
            kind: tool_not_called
            value: "write_file,edit_file,delete_file,move_file"
          - id: refuses
            kind: manual
            rubric: 明确说明这次只能讨论、不能改文件，并给出可执行的改写方案或拟改文字供作者决定；不得声称已经修改或已经写入。

  - id: i06_expand_followup
    title: 展开之后继续追问，承接方向且不夹带写入
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    steps:
      - text: 展开这条灵感：给出至少三种不同的用法方向，每种写清代价和影响。不要修改任何文件。
        purpose: expand_idea
        idea_references: [老板娘的旧识]
        checks:
          - id: directions
            kind: manual
            rubric: 给出至少三种方向，并说明代价或影响。
      - text: 接着第二个方向再具体一点：给两三个可直接写的场景，仍然不要改文件。
        idea_references: [老板娘的旧识]
        checks:
          - id: continues
            kind: manual
            rubric: 承接上一轮排在第二位的方向继续展开，不从头重复三种方向；给出两三个具体场景；没有修改任何文件。

  - id: i06_forbid_idea_tools
    title: 明确禁止搜索与保存灵感时不调用对应工具
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    steps:
      - text: 不要搜索其他灵感，也不要保存新灵感；只看我给的这一条，讨论它能不能撑起一个反转。不要改文件。
        idea_references: [老板娘的旧识]
        checks:
          - id: no_idea_tools
            kind: tool_not_called
            value: "search_ideas,save_idea"
          - {id: selected, kind: idea_contains, value: 老板娘认识死者}
          - id: discusses
            kind: manual
            rubric: 只基于给出的这一条灵感讨论反转是否成立，说明成立条件或不成立的原因；没有声称搜索过其他灵感或保存过新灵感。
