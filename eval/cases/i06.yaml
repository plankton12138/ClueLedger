version: 1
cases:
  - id: i06_forbid_idea_tools
    title: 明确禁止搜索与保存灵感时不调用对应工具
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    steps:
      - text: 不要搜索其他灵感，也不要保存新灵感；只看我给的这一条，讨论它能不能撑起一个反转。不要改文件。
        idea_references: [老板娘的旧识]
        checks:
          - id: no_idea_tools
            kind: tool_not_called
            value: "search_ideas,save_idea"
          - {id: selected, kind: idea_contains, value: 老板娘认识死者}
          - id: discusses
            kind: manual
            rubric: 只基于给出的这一条灵感讨论反转是否成立，说明成立条件或不成立的原因；没有声称搜索过其他灵感或保存过新灵感。
