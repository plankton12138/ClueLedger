version: 1
cases:
  # Q01：从「知道暗号内容」推到「提前接触过原件」，缺的是前提。核对要指出缺口，
  # 不能直接推出凶手，也不能把作者计划当作读者已见。
  - id: v10_q01_envelope_gap
    title: 遗书内容不足以认定提前接触原件
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 信封背面的暗号
        chapter: 1
        quote: 信封背面写着接头暗号：青鸟归巢。
      - title: 林远的客房证词
        chapter: 1
        quote: 林远声称案发时自己一直在客房，尚无人证实。
    inferences:
      - key: contact
        goal: 林远提前接触过信封原件
        intent: deduce
        clue_titles: [信封背面的暗号, 林远的客房证词]
    steps:
      - text: 核对「林远提前接触过信封原件」这组线索是否站得住。
        purpose: review
        review_paths: [正文/0001 雨夜.md]
        clue_review:
          inference: contact
          as_of_chapter: 1
        checks:
          - id: report_saved
            kind: clue_report_status
            value: findings
          - id: cites_real_source
            kind: clue_evidence_quote
            value: 信封背面写着接头暗号：青鸟归巢。
          - id: gap_named
            kind: manual
            rubric: >-
              必须指出「知道暗号内容」与「提前接触过原件」之间的前提缺口（还可能从别处听到、
              有人转述等），并给出可验证的补写方向；不得直接断言林远是凶手，也不得把设定里的
              作者计划或真相文档当作读者已经看到的正文。

  # Q02：新证据构成另一条信息来源，相关结论要重新核对；不能捏造林远一定看过照片。
  - id: v10_q02_key_witness
    title: 铜钥匙构成另一条信息来源
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 铜钥匙的归属
        chapter: 2
        quote: 管家将铜钥匙收进衣袋。
      - title: 走廊尽头的灯
        chapter: 2
        quote: 走廊尽头有一盏灯。
    inferences:
      - key: key_access
        goal: 管家在案发后进入过书房
        intent: suspect
        clue_titles: [铜钥匙的归属, 走廊尽头的灯]
    steps:
      - text: 看一下这组线索能不能支持管家进过书房。
        purpose: review
        review_paths: [正文/0002 走廊.md]
        clue_review:
          inference: key_access
          as_of_chapter: 2
        checks:
          - id: report_saved
            kind: clue_report_status
            value: findings
          - id: cites_key
            kind: clue_evidence_quote
            value: 管家将铜钥匙收进衣袋。
          - id: no_invention
            kind: manual
            rubric: >-
              必须承认钥匙只是「可能」的进入方式，指出还缺钥匙用途、时间或目击等环节；
              不得写成管家一定进过书房，也不得凭空补出正文没有的情节。

  # Q03：计划没有写进正文时，不能冒充读者已知。
  - id: v10_q03_plan_not_text
    title: 计划安排不等于正文已经交代
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 未说明用途的钥匙
        chapter: 2
        quote: 管家将铜钥匙收进衣袋。
    inferences:
      - key: key_hint
        goal: 读者已经知道铜钥匙能打开书房
        intent: keep_open
        clue_titles: [未说明用途的钥匙]
    steps:
      - text: 核对读者现在是否能推出钥匙能打开书房。
        purpose: review
        review_paths: [正文/0002 走廊.md]
        clue_review:
          inference: key_hint
          as_of_chapter: 2
        checks:
          - id: cites_key
            kind: clue_evidence_quote
            value: 管家将铜钥匙收进衣袋。
          - id: plan_is_not_text
            kind: manual
            rubric: >-
              必须指出设定或计划里「钥匙用途尚未说明」只是作者安排，正文没有交代读者可知的
              对应事实；不得声称读者已经知道钥匙能开书房，也不得把计划文档当作正文证据。

  # Q04：人物说法与客观事件分开，保留未核实性质。
  - id: v10_q04_testimony
    title: 证词不等于已经证实的事实
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 不在场证词
        chapter: 1
        quote: 林远声称案发时自己一直在客房，尚无人证实。
    inferences:
      - key: alibi
        goal: 林远案发时确实在客房
        intent: deduce
        clue_titles: [不在场证词]
    steps:
      - text: 核对「林远案发时确实在客房」这个结论。
        purpose: review
        review_paths: [正文/0001 雨夜.md]
        clue_review:
          inference: alibi
          as_of_chapter: 1
        checks:
          - id: cites_testimony
            kind: clue_evidence_quote
            value: 林远声称案发时自己一直在客房，尚无人证实。
          - id: testimony_split
            kind: manual
            rubric: >-
              必须把「林远自己说」与「已经证实」分开，指出目前没有旁证；不得把证词当作
              客观事实，也不得反过来断言他在撒谎。

  # Q05：组合依据由多条线索共同支撑，不要求每条单独成立。
  - id: v10_q05_combined
    title: 多线索共同支持一个结论
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 暗号内容
        chapter: 1
        quote: 信封背面写着接头暗号：青鸟归巢。
      - title: 铜钥匙
        chapter: 2
        quote: 管家将铜钥匙收进衣袋。
    inferences:
      - key: butler_access
        goal: 管家有机会接触信封与书房
        intent: suspect
        clue_titles: [暗号内容, 铜钥匙]
    steps:
      - text: 这两条线索合起来能说明管家有机会吗？
        purpose: review
        review_paths: [正文/0001 雨夜.md, 正文/0002 走廊.md]
        clue_review:
          inference: butler_access
          as_of_chapter: 2
        checks:
          - id: cites_both
            kind: clue_evidence_quote
            value: 管家将铜钥匙收进衣袋。
          - id: combined_reasoning
            kind: manual
            rubric: >-
              必须按组合依据判断：两条线索各自不完整，但一起能支持「有机会」，同时说明
              机会不等于实施；不得要求单条线索单独证明结论，也不得把机会直接写成凶手。

  # Q06：作者有意保留其他解释时，不把存在替代解释一律报错。
  - id: v10_q06_keep_open
    title: 有意保留的其他解释不算缺陷
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 管家身份
        chapter: 2
        quote: 走廊尽头有一盏灯。
    inferences:
      - key: possible_doctor
        goal: 管家可能是失踪的医生
        intent: keep_open
        clue_titles: [管家身份]
    steps:
      - text: 核对「管家可能是失踪的医生」这个开放目标。
        purpose: review
        review_paths: [正文/0002 走廊.md]
        clue_review:
          inference: possible_doctor
          as_of_chapter: 2
        checks:
          - id: keep_open_ok
            kind: manual
            rubric: >-
              开放目标下，存在其他解释本身不是缺陷；可以报告依据不足或指出可补的验证点，
              但不得把「还有别的可能」当成必须修改的错误，也不得直接宣布答案。

  # Q07：怀疑目标可以接受较弱依据，但仍要与目标相称。
  - id: v10_q07_suspect
    title: 怀疑目标接受较弱依据
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 书房的纸条
        chapter: 3
        quote: 纸条上的暗号：待补。
    inferences:
      - key: lin_visited
        goal: 林远到过书房
        intent: suspect
        clue_titles: [书房的纸条]
    steps:
      - text: 以怀疑的标准核对「林远到过书房」。
        purpose: review
        review_paths: [正文/0003 书房.md]
        clue_review:
          inference: lin_visited
          as_of_chapter: 3
        checks:
          - id: cites_paper
            kind: clue_evidence_quote
            value: 纸条上的暗号：待补。
          - id: proportionate
            kind: manual
            rubric: >-
              必须按「怀疑」的标准判断：可以认为现有依据偏弱但方向成立，并说明还缺什么；
              不得要求达到定论级证据，也不得把怀疑直接写成已经确定的事实。

  # Q08：前提在揭晓章才出现时，不能用后章内容支持前章结论。
  - id: v10_q08_future_premise
    title: 揭晓章前提不能回填前章
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 管家的身份
        chapter: 2
        quote: 管家将铜钥匙收进衣袋。
    inferences:
      - key: doctor_identity
        goal: 管家就是失踪的医生
        intent: deduce
        clue_titles: [管家的身份]
    steps:
      - text: 只按第三章以前读者能看到的内容，核对「管家就是失踪的医生」。
        purpose: review
        review_paths: [正文/0002 走廊.md, 正文/0003 书房.md]
        clue_review:
          inference: doctor_identity
          as_of_chapter: 3
        checks:
          - id: no_future
            kind: manual
            rubric: >-
              必须指出在第三章以前没有足够依据，第八章的揭晓不能当作已发生的事实引用；
              不得把真相文档或后章内容写进依据，也不得直接宣布答案。

  # Q09：叙述顺序与故事时间要分开，不能只按章节认定人物提前知道。
  - id: v10_q09_flashback
    title: 倒叙不改变人物的获知时间
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 雨夜的暗号
        chapter: 1
        quote: 信封背面写着接头暗号：青鸟归巢。
    inferences:
      - key: known_before
        goal: 林远在雨夜之前就知道暗号
        intent: suspect
        clue_titles: [雨夜的暗号]
    steps:
      - text: 核对「林远在雨夜之前就知道暗号」，注意叙述顺序不等于故事时间。
        purpose: review
        review_paths: [正文/0001 雨夜.md]
        clue_review:
          inference: known_before
          as_of_chapter: 1
        checks:
          - id: order_split
            kind: manual
            rubric: >-
              必须说明现有正文只写了雨夜当时的暗号，没有交代他此前的获知时间；
              不得因为暗号出现在第一章就断言他此前已经知道，也不得把后章内容当作已知。

  # Q10：不存在的目标要说明缺项或请求澄清，不自行编造。
  - id: v10_q10_missing_target
    title: 缺少可核对的目标时不伪造报告
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 书房的纸条
        chapter: 3
        quote: 纸条上的暗号：待补。
    inferences:
      - key: paper_origin
        goal: 纸条是管家留下的
        intent: suspect
        clue_titles: [书房的纸条]
    steps:
      - text: 先只讨论：如果要核对「纸条是管家留下的」，现在缺哪些正文信息？不要修改文件，也不要发布报告。
        purpose: chat
        selected: 正文/0003 书房.md
        checks:
          - id: clarify
            kind: manual
            rubric: >-
              必须指出缺项（纸条的来源、笔迹、时间或目击），可以请求作者补充目标或范围；
              不得直接宣布结论，也不得在没有核对范围时发布报告。

  # Q11：构思要给出可用的不同解释与验证安排，并遵守作者已给限制。
  - id: v10_q11_alternatives
    title: 构思给出不同解释与验证安排
    family: 构思
    layer: end_to_end
    fixture: inn.json
    steps:
      - text: >-
          不修改任何文件，只给方案：铜钥匙可能是谁收走的，有哪几种不同解释？
          每种解释需要什么正文细节才能成立，又该怎么在前三章里验证？至少给三种，并说明各自的前提。
          本轮只依据前三章正文构思，不读取第四章及之后的正文、真相文档或角色小传，不引入后章揭晓。
        selected: 正文/0002 走廊.md
        checks:
          - id: three_ways
            kind: manual
            rubric: >-
              必须给出至少三种彼此不同的解释，每种附上成立所需的前提与可在前三章验证的安排；
              不得把某一种当成既定答案，也不得引入后章揭晓或真相文档的内容。

  # Q12：明确保存后才写入线索模块，不改正文。
  - id: v10_q12_save_idea
    title: 明确要求后才把方案存进模块
    family: 构思
    layer: end_to_end
    fixture: inn.json
    module_tools: true
    steps:
      - text: >-
          把「铜钥匙可能只是管家日常随身携带」这一种解释，作为一条线索构思保存到模块里，
          标题叫「钥匙的日常用途」，正文说明它如何解释第二章的描写。不要改正文。
        selected: 正文/0002 走廊.md
        checks:
          - id: module_written
            kind: module_contains
            value: 钥匙的日常用途
          - id: only_named
            kind: manual
            rubric: >-
              只需要保存作者点名的这一条解释；不得顺手写入其他候选或改写正文，
              也不得把尚未确认的解释写成作品事实。

  # Q13：前章改写可以用计划安排伏笔，但不能等价泄露后章信息。
  - id: v10_q13_early_revision
    title: 前章改写不提前泄露后章信息
    family: 改写
    layer: end_to_end
    fixture: inn.json
    steps:
      - text: >-
          把第三章改写成：林远在书房发现纸条上的暗号还没写完，心里起疑。
          只改这一章，不要写出管家是凶手或失踪医生，也不要提到第八章的揭晓。
        selected: 正文/0003 书房.md
        references: [设定集/线索.md]
        allowed_changes: [正文/0003 书房.md]
        required_changes: [正文/0003 书房.md]
        checks:
          - id: no_future_reveal
            kind: file_excludes
            path: 正文/0003 书房.md
            value: 失踪的医生
          - id: keeps_suspicion
            kind: manual
            rubric: >-
              改写要停在「林远起疑」这一层：用纸条、未写完的暗号或他自己的证词推进怀疑，
              不得写明管家身份、凶手结论或第八章的揭晓；不得改动第二章等未授权文件。
          - id: scoped_rewrite
            kind: manual
            rubric: >-
              改写应停在「起疑」这一层，用纸条与未写完的暗号推进；不得写出管家身份、
              凶手结论或后章揭晓，也不得改动第二章等未授权文件。

  # Q14：相关来源变化要复核，无关编辑不该让所有引用失效。
  - id: v10_q14_irrelevant_edit
    title: 无关编辑不让引用整体失效
    family: 来源更新
    fixture: inn.json
    clues:
      - title: 走廊的灯
        chapter: 2
        quote: 走廊尽头有一盏灯。
    inferences:
      - key: lamp_timing
        goal: 灯在案发时是亮着的
        intent: suspect
        clue_titles: [走廊的灯]
    steps:
      - text: 核对「灯在案发时是亮着的」。
        purpose: review
        review_paths: [正文/0002 走廊.md]
        clue_review:
          inference: lamp_timing
          as_of_chapter: 2
        checks:
          - id: cites_lamp
            kind: clue_evidence_quote
            value: 走廊尽头有一盏灯。
      - text: 只回答：这份核对报告现在还能直接当依据吗？一句话。
        purpose: chat
        external_updates:
          设定集/角色小传/林远.md: "# 林远\n\n身份：侦探。调查动机：寻找失踪的弟弟。行事谨慎。\n"
        checks:
          - id: unrelated_ok
            kind: manual
            rubric: >-
              只改了无关的角色小传时，报告不应被当成整体失效；可以提示重新读取。
              不得声称所有引用都已作废，也不得把无关编辑当作核对结论变化的理由。

  # Q15：材料不足时允许 incomplete，不把连接问题说成作品问题。
  - id: v10_q15_insufficient
    title: 材料不足时如实报未完成
    family: 推理核对
    fixture: inn.json
    clues:
      - title: 失踪的医生
        chapter: 2
        quote: 管家将铜钥匙收进衣袋。
    inferences:
      - key: doctor_link
        goal: 管家与失踪的医生是同一个人
        intent: deduce
        clue_titles: [失踪的医生]
    steps:
      - text: 核对「管家与失踪的医生是同一个人」，只用手上能读到的正文。
        purpose: review
        review_paths: [正文/0002 走廊.md]
        clue_review:
          inference: doctor_link
          as_of_chapter: 2
        checks:
          - id: honest
            kind: manual
            rubric: >-
              依据不足时应当报告 findings 或 incomplete 并写明缺什么；不得因为读不到
              后章就断言作品逻辑有问题，也不得把工具或读取限制说成情节缺陷。

  # Q16：完整流程——核对、讨论改写、再核对，结论随新正文变化。
  - id: v10_q16_full_loop
    title: 核对后按建议补写并复查
    family: 完整流程
    layer: end_to_end
    fixture: inn.json
    clues:
      - title: 信封上的暗号
        chapter: 1
        quote: 信封背面写着接头暗号：青鸟归巢。
    inferences:
      - key: contact_again
        goal: 林远提前接触过信封原件
        intent: deduce
        clue_titles: [信封上的暗号]
    steps:
      - text: 核对「林远提前接触过信封原件」，并给出最小补写建议。
        purpose: review
        review_paths: [正文/0001 雨夜.md]
        clue_review:
          inference: contact_again
          as_of_chapter: 1
        checks:
          - id: report_saved
            kind: clue_report_status
            value: findings
      - text: >-
          按上一轮的建议补一处细节：让林远无意中提到「青鸟」后改口，只改第一章，其余不动。
        selected: 正文/0001 雨夜.md
        allowed_changes: [正文/0001 雨夜.md]
        required_changes: [正文/0001 雨夜.md]
        checks:
          - id: hint_added
            kind: file_contains
            path: 正文/0001 雨夜.md
            value: 青鸟
          - id: scoped
            kind: manual
            rubric: >-
              只补林远与暗号的联系，不宣布结论；不得写出凶手或后章揭晓，也不得改动其他文件。
      - text: 用改后的第一章重新核对同一个目标。
        purpose: review
        review_paths: [正文/0001 雨夜.md]
        clue_review:
          inference: contact_again
          as_of_chapter: 1
        checks:
          - id: rereview
            kind: manual
            rubric: >-
              必须基于改后的正文重新判断：要么指出补写已补上部分缺口，要么说明还缺什么；
              不得直接复制上一轮结论，也不得把补写当成已经证明。
