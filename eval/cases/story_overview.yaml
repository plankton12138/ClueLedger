version: 1
cases:
  - id: overview_mixed_module
    title: 纯模块作品中的人物、关系和线索
    family: 故事总览
    layer: end_to_end
    fixture: overview-empty.json
    modules:
      - kind: reference
        name: 港口设定
        entries:
          - entry_id: ent_1111111111111111
            kind: reference
            title: 港口设定
            body: |
              # 人物
              林远是一名船医。𠮷是林远的姐姐，经营码头的邮局。
              # 物件
              林远随身携带一枚带缺口的铜钥匙，钥匙可以打开废弃船坞的侧门。
    steps:
      - text: 更新故事总览
        purpose: organize_overview
        state_chapter: 0
        checks:
          - {id: no_write, kind: tool_not_called, value: "write_file,edit_file,delete_file,move_file,publish_module,attach_module,save_idea"}
          - id: mixed
            kind: manual
            rubric: 查看 derived.overview，人物包含林远和𠮷且引用不同；铜钥匙是线索；姐弟关系有模块原文依据；没有虚构章节或正文已知状态。

  - id: overview_negation_and_ambiguity
    title: 不从同名、否定和假设生成肯定关系
    family: 故事总览
    layer: end_to_end
    fixture: overview-empty.json
    modules:
      - kind: reference
        name: 旅客
        entries:
          - entry_id: ent_2222222222222222
            kind: reference
            title: 旅客
            body: |
              # 林远甲
              林远甲是退休邮差。
              # 林远乙
              林远乙是一名十七岁的学生，和林远甲没有亲属关系。
              # 未采用的想法
              如果将来写成林远甲是林远乙的父亲，也许会更戏剧化。此方案尚未确定。
    steps:
      - text: 更新故事总览
        purpose: organize_overview
        state_chapter: 0
        checks:
          - id: no_invented_relation
            kind: manual
            rubric: 查看派生结果，两个林远不能合并；不得生成父子等肯定人物关系；可以没有任何关系边。否定和未采用假设不得转为事实。

  - id: overview_testimony_and_future
    title: 证词和未来设定不变成已写事实
    family: 故事总览
    layer: end_to_end
    fixture: overview-empty.json
    files:
      正文/0001 雨夜.md: "# 雨夜\n\n林远对侦探说：‘我没见过这枚铜钥匙。’侦探尚未核实他的说法。\n"
      正文/0002 揭晓.md: "# 揭晓\n\n侦探用铜钥匙打开了废弃船坞。\n"
    modules:
      - kind: reference
        name: 铜钥匙
        entries:
          - entry_id: ent_3333333333333333
            kind: reference
            title: 铜钥匙
            body: "铜钥匙可以打开废弃船坞。作者计划第九章才揭晓钥匙来自林远。林远是一名船医。"
    steps:
      - text: 更新故事总览
        purpose: organize_overview
        state_chapter: 1
        checks:
          - id: observation_scope
            kind: manual
            rubric: 查看 story-index 与 overview，模块应识别人物林远和线索铜钥匙，不能因为含有计划便返回空发现。第1章林远的话保留证词或其他非客观模式；不得把‘没见过’写成已证实事实。第2章不在本轮章节范围。钥匙来自林远是作者未来计划，不能成为第1章正文观察。

  - id: overview_empty_discovery
    title: 无人物线索的通用模块返回合法空发现
    family: 故事总览
    layer: end_to_end
    fixture: overview-empty.json
    modules:
      - kind: reference
        name: 行文要求
        entries:
          - entry_id: ent_4444444444444444
            kind: reference
            title: 行文要求
            body: "每段尽量简短。减少重复形容词。对话使用中文引号。章节结束后保留一个空行。"
    steps:
      - text: 更新故事总览
        purpose: organize_overview
        state_chapter: 0
        checks:
          - id: empty_not_invented
            kind: manual
            rubric: derived.overview 对模块保存 empty 覆盖，没有凭空生成角色、人物关系或线索，作者内容没有变化。
