version: 1
cases:
  - id: v08_idea_discuss
    title: 选中灵感只用于讨论，不改成设定
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    steps:
      - text: 只讨论这条灵感可以怎样制造误导，不要改任何文件，也不要把它当成已经发生的事实。
        idea_references: [老板娘的旧识]
        checks:
          - {id: selected, kind: idea_contains, value: 老板娘认识死者}
          - id: discuss
            kind: manual
            rubric: 应给出至少一个可用的误导方向，并明确这是作者笔记或尚未采用的猜想；不得声称已经写进正文，不得修改文件。

  - id: v08_idea_apply
    title: 按选中灵感写异常表现但不直接揭露
    family: 灵感落实
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    files:
      正文/0006 旧识.md: "# 旧识\n\n雨停了，旅馆的人陆续下楼。\n"
    steps:
      - text: 写第六章，让老板娘见到侦探时有异常反应，但不要直接揭露她认识死者。只改第六章。
        idea_references: [老板娘的旧识]
        selected: 正文/0006 旧识.md
        allowed_changes: [正文/0006 旧识.md]
        required_changes: [正文/0006 旧识.md]
        checks:
          - id: no_direct_reveal
            kind: manual
            rubric: 应写出可回看的异常表现（动作、停顿、回避等），不能直接或等价明示老板娘认识死者；不得改其他文件。

  - id: v08_idea_unused
    title: 未选中的强诱导灵感不进入写作
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    files:
      正文/0006 早餐.md: "# 早餐\n\n雨停了，旅馆的人陆续下楼。\n"
    steps:
      - text: 写第六章，让侦探在早餐时观察旅馆里的人。只改第六章。
        selected: 正文/0006 早餐.md
        allowed_changes: [正文/0006 早餐.md]
        required_changes: [正文/0006 早餐.md]
        checks:
          - {id: no_old_acquaintance, kind: file_excludes, path: 正文/0006 早餐.md, value: 旧识}
          - id: no_leak
            kind: manual
            rubric: 不得凭空写出老板娘认识死者或等价关系；本章只做观察与铺垫。不得修改其他文件。

  - id: v08_module_autocreate
    title: 创作请求直接组织并保存多份资料
    family: 模块自主维护
    module_tools: true
    steps:
      - text: 先撰写人物小传，包括五名嫌疑人、死者与真凶，再写人们聚集到旅馆的合理原因。先不写具体作案手法和调查过程，也不要写小说正文。
        checks:
          - {id: has_suspects, kind: module_contains, value: 嫌疑人}
          - {id: has_victim, kind: module_contains, value: 死者}
          - {id: has_culprit, kind: module_contains, value: 真凶}
          - id: no_method
            kind: manual
            rubric: 检查实际保存的模块正文，不得展开杀人实施方式、作案步骤或具体调查过程。仅说明尚未撰写或不包含这些内容不算越界，不能按是否出现“作案手法”四字判定。
          - id: self_organized
            kind: manual
            rubric: 应在同一轮内完成并保存有实际内容的本作品模块，覆盖人物小传与聚集、调查前提，并实际用于本作品；允许合并为一份或拆成多份，按内容完整性验收，不按模块数量判定。不得把讨论或清单当成完成，也不写具体作案手法、调查过程或小说正文。

  - id: v08_module_update
    title: 下一轮定位已有模块并局部修改
    family: 模块自主维护
    modules:
      - kind: characters
        name: 人物设定
        entries:
          - entry_id: doctor
            kind: character
            title: 医生
            body: 医生是死者的旧友，知道一间上锁的诊室。
          - entry_id: butler
            kind: character
            title: 管家
            body: 管家负责钥匙，案发时在一楼。
    steps:
      - text: 把医生改成死者的姐姐，其余不变。
        checks:
          - {id: still_bound, kind: module_bound, value: 人物设定}
          - {id: has_sister, kind: module_contains, value: 姐姐}
          - {id: keeps_butler, kind: module_contains, value: 管家负责钥匙}
          - {id: no_question_or_file_write, kind: tool_not_called, value: "ask_author,write_file,edit_file"}
          - id: local_update
            kind: manual
            rubric: 应读取并修改已装的「人物设定」，只将医生与死者的关系改为姐姐；诊室信息、管家原文及条目 ID 和字段保留，不新建重复模块，不改其他模块或文件。

  - id: v08_module_discuss
    title: 讨论点子时不保存模块
    family: 模块边界
    module_tools: true
    steps:
      - text: 这个「医生其实是死者的姐姐」的点子怎么样？先别保存，也不要改任何资料。
        checks:
          - {id: no_save, kind: tool_not_called, value: "prepare_module_changes,apply_module_changes"}
          - id: discuss
            kind: manual
            rubric: 应只讨论这个点子的效果与风险，不建立模块、不保存内容、不声称已经写进作品。

  - id: v08_module_reference
    title: 已装模块的动机可以被引用
    family: 模块读取
    modules:
      - kind: characters
        name: 旧案人物
        entries:
          - entry_id: motive
            kind: character
            title: 管家动机
            body: 管家为掩盖自己就是失踪医生的事实而杀人。
    steps:
      - text: 参考已装模块里管家的动机，讨论第八章揭晓是否成立，不改任何文件。
        checks:
          - {id: bound, kind: module_bound, value: 旧案人物}
          - id: uses_module
            kind: manual
            rubric: 应引用“掩盖失踪医生身份”这一动机来判断揭晓是否成立，并明确这是模块内容而不是正文已发生事实；不得修改文件。

  - id: v08_author_question
    title: 需要作者决定时提问并在回答后继续
    family: 提问与恢复
    files:
      正文/0001 雨夜.md: |
        # 雨夜

        侦探在深夜抵达旅馆，前台的登记簿上少了一个名字。
    steps:
      - text: 我想让管家和医生都有作案可能，但凶手的身份还没定。先问我一个必须由我决定的问题，等我回答后再继续。
        allowed_changes: []
        expect_needs_input: true
        checks:
          - {id: no_save, kind: tool_not_called, value: "write_file,edit_file"}
          - id: asks_one
            kind: manual
            rubric: 应只提出一个必须由作者决定的创作问题，给出可选答案或明确的选择范围，并结束本轮；不建立模块、不改正文、不声称已经完成。
      - text: 选第 2 种：改写第八章和真相，让凶手的身份悬置。只改已有文件，不要新建人物文件，也不要改前面几章。
        reply_to_question: true
        allowed_changes:
          - 正文/0008 揭晓.md
          - 设定集/真相.md
          - 设定集/线索.md
          - 设定集/角色小传/管家.md
        required_changes:
          - 正文/0008 揭晓.md
          - 设定集/真相.md
        checks:
          - id: continues
            kind: manual
            rubric: 应承接原请求并采用“改写第八章和真相、凶手悬置”的回答继续工作，不把回答当成一项新任务，也不重复提出同一个问题。
