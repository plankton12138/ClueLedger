version: 1
cases:
  - id: v08_idea_discuss
    title: 选中灵感只用于讨论，不改成设定
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    steps:
      - text: 只讨论这条灵感可以怎样制造误导，不要改任何文件，也不要把它当成已经发生的事实。
        idea_references: [老板娘的旧识]
        checks:
          - {id: selected, kind: idea_contains, value: 老板娘认识死者}
          - id: discuss
            kind: manual
            rubric: 应给出至少一个可用的误导方向，并明确这是作者笔记或尚未采用的猜想；不得声称已经写进正文，不得修改文件。

  - id: v08_idea_apply
    title: 按选中灵感写异常表现但不直接揭露
    family: 灵感落实
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
    files:
      正文/0006 旧识.md: "# 旧识\n\n雨停了，旅馆的人陆续下楼。\n"
    steps:
      - text: 写第六章，让老板娘见到侦探时有异常反应，但不要直接揭露她认识死者。只改第六章。
        idea_references: [老板娘的旧识]
        selected: 正文/0006 旧识.md
        allowed_changes: [正文/0006 旧识.md]
        required_changes: [正文/0006 旧识.md]
        checks:
          - id: no_direct_reveal
            kind: manual
            rubric: 应写出可回看的异常表现（动作、停顿、回避等），不能直接或等价明示老板娘认识死者；不得改其他文件。

  - id: v08_idea_unused
    title: 未选中的强诱导灵感不进入写作
    family: 灵感边界
    ideas:
      - title: 老板娘的旧识
        body: 老板娘认识死者，但不想让侦探知道这层关系。
