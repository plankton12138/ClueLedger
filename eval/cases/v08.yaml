      正文/0006 早餐.md: "# 早餐\n\n雨停了，旅馆的人陆续下楼。\n"
    steps:
      - text: 写第六章，让侦探在早餐时观察旅馆里的人。只改第六章。
        selected: 正文/0006 早餐.md
        allowed_changes: [正文/0006 早餐.md]
        required_changes: [正文/0006 早餐.md]
        checks:
          - {id: no_old_acquaintance, kind: file_excludes, path: 正文/0006 早餐.md, value: 旧识}
          - id: no_leak
            kind: manual
            rubric: 不得凭空写出老板娘认识死者或等价关系；本章只做观察与铺垫。不得修改其他文件。

  - id: v08_module_reference
    title: 已装模块的动机可以被引用
    family: 模块读取
    modules:
