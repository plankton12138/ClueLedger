        name: 旧案人物
        entries:
          - entry_id: motive
            kind: character
            title: 管家动机
            body: 管家为掩盖自己就是失踪医生的事实而杀人。
    steps:
      - text: 参考已装模块里管家的动机，讨论第八章揭晓是否成立，不改任何文件。
