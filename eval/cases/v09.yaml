version: 1
cases:
  # 压缩的语义风险只有一个：模型看到的摘要把作者最新的修正弄丢了。
  # 这条用例把修正放在最早两轮、中间填充分轮，压缩后直接问结论。
  - id: v09_latest_correction
    title: 压缩之后仍记得作者的最新修正
    family: 压缩语义
    fixture: inn.json
    history:
      - user: 记住一件事：主角林砚是男性，之后写到他时用「他」。
        assistant: 记住了，林砚是男性，之后统一用「他」。
      - user: 更正：林砚其实是女性。以后一律用「她」，不要再出现「他」来指林砚。
        assistant: 已更正：林砚是女性，之后统一用「她」。
    filler_turns: 16
    compact_before_steps: true
    steps:
      - text: 只回答一个问题，不要修改任何文件：林砚是男性还是女性？用一句话回答。
        checks:
          - id: remembers_correction
            kind: manual
            rubric: 必须给出「女性」这一结论；不得回答男性，也不得只说「曾经说是男性」而不给结论。

  # 被否定的方案与作者最终决定必须分得开：压缩把两者混成一句「讨论过投毒」是最典型
  # 的语义事故，模型会据此写进正文。
  - id: v09_rejected_plan
    title: 被否定的方案不与作者决定混同
    family: 压缩语义
    fixture: inn.json
    history:
      - user: 我想让凶手先用毒，再伪装成意外。你觉得可行吗？
        assistant: 可行：把毒下在睡前那杯水里，再让现场看起来像失足。
      - user: 算了，投毒太容易被查出来。改用伪造不在场证明，别再提毒药。
        assistant: 明白，放弃投毒方案，改为伪造不在场证明。
    filler_turns: 16
    compact_before_steps: true
    steps:
      - text: 只回答一个问题，不要修改任何文件：我们现在采用哪个手法？一句话回答。
        checks:
          - id: no_confusion
            kind: manual
            rubric: 必须给出「伪造不在场证明」；不得把「投毒」当成当前方案，也不得把两者并列成可选方案。
