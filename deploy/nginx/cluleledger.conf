# 线簿单域名反向代理（nginx）
# 将 clue.example.com 替换为正式域名；证书路径按 certbot 实际位置调整。
# 写作服务与支付服务都只监听 127.0.0.1，公网只经过这里。

server {
    listen 80;
    listen [::]:80;
    server_name clue.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clue.example.com;

    ssl_certificate     /etc/letsencrypt/live/clue.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clue.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 支付服务：账单接口与支付宝通知/回跳
    location /api/billing/ {
        proxy_pass http://127.0.0.1:8300;
        include /etc/nginx/snippets/cluleledger-proxy.conf;
    }
    # 扫码支付短链：手机扫码后 302 到支付宝收银台
    location ^~ /pay/ {
        proxy_pass http://127.0.0.1:8300;
        include /etc/nginx/snippets/cluleledger-proxy.conf;
    }
    location = /notify/alipay {
        proxy_pass http://127.0.0.1:8300;
        include /etc/nginx/snippets/cluleledger-proxy.conf;
        proxy_read_timeout 30s;
    }
    location ^~ /return/alipay {
        proxy_pass http://127.0.0.1:8300;
        include /etc/nginx/snippets/cluleledger-proxy.conf;
    }

    # 内部模型代理与运营接口不对外；relay 只监听回环，这里再显式拒绝。
    location ^~ /v1/ {
        return 404;
    }

    # 写作/操作事件流：关闭缓冲并放宽读超时。
    location ~ ^/api/(file-workspaces/[^/]+/events|operations/[^/]+/stream)$ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/cluleledger-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 账号、作品、模型、模块库与 SPA
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/cluleledger-proxy.conf;
    }
}
