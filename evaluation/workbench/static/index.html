<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>评测工作台</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1914;
      --muted: #5c564c;
      --line: #d7d0c2;
      --ok: #1f6b3a;
      --bad: #9b1c1c;
      --warn: #8a5a00;
      --panel: #fffdf8;
      --accent: #245b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #e7f0ef 0%, transparent 55%),
        linear-gradient(180deg, #efe8da 0%, var(--bg) 40%);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 1.75rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.02em;
    }
    header p { margin: 0.35rem 0 0; color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1rem;
      padding: 1rem 1.75rem 2rem;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 1rem 1.1rem;
    }
    h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .summary div {
      border: 1px solid var(--line);
      padding: 0.55rem 0.65rem;
    }
    .summary strong { display: block; font-size: 1.25rem; }
    .gate-ok { color: var(--ok); }
    .gate-bad { color: var(--bad); }
    .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 0.4rem 0.35rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    button, .btn {
      appearance: none;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      font: inherit;
    }
    button.secondary {
      background: transparent;
      color: var(--accent);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0; }
    .review-card {
      border-top: 1px solid var(--line);
      padding: 0.85rem 0;
    }
    label { display: block; margin: 0.35rem 0 0.15rem; color: var(--muted); font-size: 0.85rem; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--line);
      background: #fff;
    }
    textarea { min-height: 4rem; resize: vertical; }
    .error { color: var(--bad); white-space: pre-wrap; }
    .checks { margin: 0.25rem 0 0; padding-left: 1rem; color: var(--muted); }
    details { margin-top: 0.35rem; }
  </style>
</head>
<body>
  <header>
    <h1>评测工作台</h1>
    <p>旧版静态页（未构建前端时回退）。请执行 <code>cd frontend && npm run build</code> 后重启工作台，即可从运行列表选择记录。</p>
  </header>
  <main>
    <section>
      <h2>报告</h2>
      <div id="report-error" class="error" hidden></div>
      <div id="summary" class="summary"></div>
      <div class="toolbar">
        <button type="button" id="reload" class="secondary">重新加载</button>
        <button type="button" id="score">合并复核到报告</button>
      </div>
      <div id="gate" class="muted"></div>
      <div id="cases"></div>
    </section>
    <section>
      <h2>人工复核</h2>
      <p class="muted">通过/失败必须填写证据位置。保存后可点「合并复核到报告」。</p>
      <div id="reviews"></div>
      <div class="toolbar">
        <button type="button" id="save-reviews">保存复核</button>
      </div>
      <div id="review-status" class="muted"></div>
    </section>
  </main>
  <script>
    const state = { report: null, reviews: [] };

    async function api(path, options) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await response.json();
      if (!response.ok) {
        const err = data.error || {};
        throw new Error(`[${err.code || response.status}] ${err.where || path}：${err.why || "请求失败"}。建议：${err.fix || "重试"}`);
      }
      return data;
    }

    function verdictLabel(v) {
      return ({ pass: "通过", fail: "失败", pending_review: "待复核", skipped: "跳过" })[v] || v;
    }

    function renderSummary(report) {
      const s = report.summary || {};
      const gate = report.gate || {};
      document.getElementById("summary").innerHTML = [
        ["通过", s.pass || 0],
        ["失败", s.fail || 0],
        ["待复核", s.pending_review || 0],
        ["基础设施错误", s.infrastructure_error || 0],
        ["未运行", s.not_run || 0],
        ["门禁", gate.passed ? "通过" : "不通过"],
      ].map(([k, v]) => `<div><span class="muted">${k}</span><strong class="${k === "门禁" ? (gate.passed ? "gate-ok" : "gate-bad") : ""}">${v}</strong></div>`).join("");

      const blockers = (gate.blockers || []).map(b => `<li>[${b.kind}] ${b.case_id}: ${b.detail}</li>`).join("");
      const warnings = (gate.warnings || []).map(b => `<li>[${b.kind}] ${b.case_id}: ${b.detail}</li>`).join("");
      document.getElementById("gate").innerHTML =
        (blockers ? `<p>阻断</p><ul>${blockers}</ul>` : "") +
        (warnings ? `<p>提示</p><ul>${warnings}</ul>` : "");
    }

    function renderCases(report) {
      const rows = (report.cases || []).map(caseItem => {
        const attempts = (caseItem.attempts || []).map(a => {
          const checks = (a.checks || []).map(c =>
            `<li>${c.id} · ${c.level} · ${verdictLabel(c.verdict)}${c.reason ? " — " + c.reason : ""}</li>`
          ).join("");
          return `<tr>
            <td>${caseItem.case_id}</td>
            <td>#${a.attempt}</td>
            <td>${a.status}</td>
            <td>${verdictLabel(a.outcome || "-")}
              <ul class="checks">${checks}</ul>
            </td>
          </tr>`;
        }).join("");
        return attempts;
      }).join("");
      document.getElementById("cases").innerHTML = `
        <table>
          <thead><tr><th>案例</th><th>试验</th><th>状态</th><th>结论</th></tr></thead>
          <tbody>${rows || "<tr><td colspan=4 class=muted>无试验</td></tr>"}</tbody>
        </table>`;
    }

    function pendingHumanItems(report) {
      const items = [];
      for (const row of report.attempts || []) {
        if (row.status !== "completed") continue;
        for (const check of row.checks || []) {
          if (check.level === "human" && check.verdict === "pending_review") {
            items.push({
              case_id: row.case_id,
              attempt: row.attempt,
              check_id: check.id,
              question: check.reason || check.id,
            });
          }
        }
      }
      return items;
    }

    function reviewKey(item) {
      return `${item.case_id}::${item.attempt}::${item.check_id}`;
    }

    function renderReviews(report, reviews) {
      const pending = pendingHumanItems(report);
      const byKey = Object.fromEntries(reviews.map(r => [reviewKey(r), r]));
      const root = document.getElementById("reviews");
      if (!pending.length) {
        root.innerHTML = `<p class="muted">没有待复核的人工项。</p>`;
        return;
      }
      root.innerHTML = pending.map(item => {
        const existing = byKey[reviewKey(item)] || {};
        const key = reviewKey(item);
        return `<div class="review-card" data-key="${key}">
          <strong>${item.case_id} #${item.attempt} · ${item.check_id}</strong>
          <p>${item.question}</p>
          <label>结论</label>
          <select data-field="verdict">
            <option value="pending_review"${existing.verdict === "pending_review" || !existing.verdict ? " selected" : ""}>不确定 / 待定</option>
            <option value="pass"${existing.verdict === "pass" ? " selected" : ""}>通过</option>
            <option value="fail"${existing.verdict === "fail" ? " selected" : ""}>失败</option>
          </select>
          <label>证据位置</label>
          <input data-field="evidence_ref" value="${existing.evidence_ref || ""}" placeholder="如 after:正文/0003.md 雪夜段落" />
          <label>说明（可选）</label>
          <textarea data-field="reason">${existing.reason || ""}</textarea>
        </div>`;
      }).join("");
    }

    function collectReviewsFromDom() {
      return [...document.querySelectorAll(".review-card")].map(card => {
        const [case_id, attempt, check_id] = card.dataset.key.split("::");
        const verdict = card.querySelector('[data-field="verdict"]').value;
        const evidence_ref = card.querySelector('[data-field="evidence_ref"]').value.trim();
        const reason = card.querySelector('[data-field="reason"]').value.trim();
        return { case_id, attempt: Number(attempt), check_id, verdict, evidence_ref, reason };
      });
    }

    async function loadAll() {
      const err = document.getElementById("report-error");
      err.hidden = true;
      try {
        const report = await api("/api/report");
        const payload = await api("/api/reviews");
        state.report = report;
        state.reviews = payload.reviews || [];
        renderSummary(report);
        renderCases(report);
        renderReviews(report, state.reviews);
      } catch (e) {
        err.hidden = false;
        err.textContent = String(e.message || e);
      }
    }

    document.getElementById("reload").onclick = () => loadAll();
    document.getElementById("save-reviews").onclick = async () => {
      const status = document.getElementById("review-status");
      try {
        const reviews = collectReviewsFromDom();
        const saved = await api("/api/reviews", { method: "PUT", body: JSON.stringify({ reviews }) });
        state.reviews = saved.reviews || reviews;
        status.textContent = `已保存 ${state.reviews.length} 条复核`;
      } catch (e) {
        status.textContent = String(e.message || e);
      }
    };
    document.getElementById("score").onclick = async () => {
      const status = document.getElementById("review-status");
      try {
        const reviews = collectReviewsFromDom();
        await api("/api/reviews", { method: "PUT", body: JSON.stringify({ reviews }) });
        const report = await api("/api/score", { method: "POST", body: "{}" });
        state.report = report;
        renderSummary(report);
        renderCases(report);
        renderReviews(report, reviews);
        status.textContent = `已合并；门禁 ${report.gate && report.gate.passed ? "通过" : "不通过"}`;
      } catch (e) {
        status.textContent = String(e.message || e);
      }
    };

    loadAll();
  </script>
</body>
</html>
