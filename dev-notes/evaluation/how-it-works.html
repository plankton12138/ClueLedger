<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>评测怎么运转 · 交互教学</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f3f1ec;
    --ink: #1c1914;
    --muted: #5c564c;
    --line: #d9d2c6;
    --panel: #fffcf7;
    --accent: #2c5f4a;
    --accent-soft: #e4efe9;
    --warm: #8a5a2b;
    --warm-soft: #f3e8da;
    --cool: #2f4d6e;
    --cool-soft: #e4ebf3;
    --danger: #7a3535;
    --danger-soft: #f3e4e4;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #161410;
      --ink: #efe8dc;
      --muted: #a89f90;
      --line: #3a342c;
      --panel: #1f1b16;
      --accent: #7dba9a;
      --accent-soft: #24362e;
      --warm: #d4a574;
      --warm-soft: #3a2e22;
      --cool: #8eb0d4;
      --cool-soft: #243040;
      --danger: #e0a0a0;
      --danger-soft: #3a2424;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif;
    font-size: 16px;
    line-height: 1.7;
  }
  main { max-width: 880px; margin: 0 auto; padding: 32px 18px 80px; }
  .eyebrow {
    font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 8px 0 10px;
    font-size: clamp(1.55rem, 3vw, 1.95rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .lede { margin: 0 0 18px; color: var(--muted); max-width: 40em; }
  .modes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
    font-family: "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mode {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: inherit;
    border-radius: 999px;
    padding: 9px 16px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .mode.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    .mode.active { color: #122018; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 20px 18px;
    min-height: 360px;
  }
  .hidden { display: none !important; }
  .acts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
    gap: 6px;
    margin-bottom: 12px;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
  }
  .act {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: inherit;
    border-radius: 999px;
    padding: 8px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .act.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .rail {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin: 0 0 12px;
  }
  .rail span {
    height: 4px;
    border-radius: 999px;
    background: var(--line);
  }
  .rail span.on { background: var(--accent); }
  .num {
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  h2 { margin: 6px 0 12px; font-size: 1.28rem; line-height: 1.3; }
  p { margin: 0 0 12px; }
  .quote {
    margin: 12px 0;
    padding: 12px 14px;
    border-left: 3px solid var(--warm);
    background: var(--warm-soft);
    font-size: 0.95rem;
  }
  .code-box {
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .code-box h3 {
    margin: 0 0 8px;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .code-row {
    display: grid;
    gap: 8px;
  }
  .code-item {
    appearance: none;
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: transparent;
    color: inherit;
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    cursor: pointer;
  }
  .code-item:hover, .code-item.open {
    border-color: var(--cool);
    background: var(--cool-soft);
  }
  .code-item .file {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    color: var(--cool);
    overflow-wrap: anywhere;
  }
  .code-item .role {
    font-size: 13px;
    margin-top: 2px;
  }
  .code-item .more {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .code-item.open .more { display: block; }
  .nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
  }
  .nav button {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: inherit;
    border-radius: 999px;
    padding: 8px 16px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .nav button:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  @media (prefers-color-scheme: dark) {
    .nav button.primary { color: #122018; }
  }
  .map-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 14px;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
  }
  .map-node {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: inherit;
    border-radius: 12px;
    padding: 12px;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .map-node .k {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .map-node .t { font-weight: 600; margin-top: 4px; font-size: 14px; }
  .map-node.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .detail-title { margin: 0 0 8px; font-size: 1.15rem; }
  .files {
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
  }
  .files li {
    border-top: 1px solid var(--line);
    padding: 10px 0;
  }
  .files .path {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    color: var(--cool);
    overflow-wrap: anywhere;
  }
  .files .why { font-size: 14px; margin-top: 2px; }
  .quiz-q { margin-bottom: 14px; }
  .quiz-opts {
    display: grid;
    gap: 8px;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
  }
  .quiz-opt {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: inherit;
    border-radius: 10px;
    padding: 12px 14px;
    text-align: left;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .quiz-opt:hover:not(:disabled) { border-color: var(--cool); }
  .quiz-opt.correct {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .quiz-opt.wrong {
    border-color: var(--danger);
    background: var(--danger-soft);
  }
  .quiz-fb {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--cool-soft);
    font-size: 14px;
  }
  .quiz-fb.ok { background: var(--accent-soft); }
  .quiz-fb.bad { background: var(--danger-soft); }
  .quiz-meta {
    margin-top: 12px;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  footer {
    margin-top: 24px;
    font-family: "SF Pro Text", "PingFang SC", sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--accent); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">evaluation · 交互教学</p>
  <h1>设计怎么定，代码站哪一岗</h1>
  <p class="lede">重点在评测与改稿设计。每个设计决策下面挂「落点代码」。四种学法可切换；「Scope 落地」按产品链路逐步展开 gate。</p>

  <div class="modes" role="tablist" aria-label="学法">
    <button type="button" class="mode active" data-mode="story" role="tab" aria-selected="true">故事</button>
    <button type="button" class="mode" data-mode="map" role="tab" aria-selected="false">设计地图</button>
    <button type="button" class="mode" data-mode="quiz" role="tab" aria-selected="false">找代码</button>
    <button type="button" class="mode" data-mode="scope" role="tab" aria-selected="false">Scope 落地</button>
  </div>

  <section id="view-story" class="panel" aria-label="故事">
    <div class="rail" id="rail" aria-hidden="true"></div>
    <div class="acts" id="acts" role="tablist" aria-label="幕次"></div>
    <div id="stage"></div>
    <div class="nav">
      <button type="button" id="prev">上一幕</button>
      <button type="button" class="primary" id="next">下一幕</button>
    </div>
  </section>

  <section id="view-map" class="panel hidden" aria-label="设计地图">
    <p class="num">点设计，不点文件名</p>
    <h2 style="margin-top:4px">这条闭环里，决策落在哪</h2>
    <div class="map-grid" id="map-grid"></div>
    <div id="map-detail"></div>
  </section>

  <section id="view-quiz" class="panel hidden" aria-label="找代码">
    <p class="num">自测</p>
    <h2 style="margin-top:4px">这句设计，该找谁</h2>
    <div id="quiz"></div>
    <div class="quiz-meta">
      <span id="quiz-score"></span>
      <button type="button" class="mode" id="quiz-next" style="margin:0">下一题</button>
    </div>
  </section>

  <section id="view-scope" class="panel hidden" aria-label="Scope 落地">
    <div class="rail" id="scope-rail" aria-hidden="true"></div>
    <div class="acts" id="scope-acts" role="tablist" aria-label="Scope 步骤"></div>
    <div id="scope-stage"></div>
    <div class="nav">
      <button type="button" id="scope-prev">上一步</button>
      <button type="button" class="primary" id="scope-next">下一步</button>
    </div>
  </section>

  <footer>
    正文 <a href="how-it-works.md">how-it-works.md</a> ·
    模块图 <a href="structure-map.html">structure-map.html</a> ·
    总图 <a href="design.md">design.md</a>
  </footer>
</main>

let mode = "story";
let idx = 0;
let mapIdx = 0;
let quizIdx = 0;
let quizAnswered = 0;
let quizCorrect = 0;
let quizLocked = false;
let scopeIdx = 0;

const $ = (id) => document.getElementById(id);

function setMode(next) {
  mode = next;
  document.querySelectorAll(".mode[data-mode]").forEach((btn) => {
    const on = btn.dataset.mode === mode;
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-selected", on ? "true" : "false");
  });
  $("view-story").classList.toggle("hidden", mode !== "story");
  $("view-map").classList.toggle("hidden", mode !== "map");
  $("view-quiz").classList.toggle("hidden", mode !== "quiz");
  $("view-scope").classList.toggle("hidden", mode !== "scope");
  if (mode === "story") paintStory();
  if (mode === "map") paintMap();
  if (mode === "quiz") paintQuiz();
  if (mode === "scope") paintScope();
}

document.querySelectorAll(".mode[data-mode]").forEach((btn) => {
  btn.addEventListener("click", () => setMode(btn.dataset.mode));
});

function paintStory() {
  $("rail").innerHTML = ACTS.map((_, i) => `<span class="${i <= idx ? "on" : ""}"></span>`).join("");
  $("acts").innerHTML = ACTS.map(
    (a, i) =>
      `<button type="button" class="act ${i === idx ? "active" : ""}" data-i="${i}">${a.tab}</button>`
  ).join("");
  $("acts").querySelectorAll(".act").forEach((btn) => {
    btn.addEventListener("click", () => {
      idx = Number(btn.dataset.i);
      paintStory();
    });
  });
  const a = ACTS[idx];
  const code = a.code
    .map(
      (c, i) => `
      <button type="button" class="code-item" data-c="${i}">
        <div class="file">${c.file}</div>
        <div class="role">${c.role}</div>
        <div class="more">${c.more}</div>
      </button>`
    )
    .join("");
  $("stage").innerHTML = `
    <div class="num">${a.num}</div>
    <h2>${a.title}</h2>
    ${a.body}
    <div class="code-box">
      <h3>设计落点 · 点开看代码干什么</h3>
      <div class="code-row">${code}</div>
    </div>`;
  $("stage").querySelectorAll(".code-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      const open = btn.classList.contains("open");
      $("stage").querySelectorAll(".code-item").forEach((b) => b.classList.remove("open"));
      if (!open) btn.classList.add("open");
    });
  });
  $("prev").disabled = idx === 0;
  $("next").disabled = idx === ACTS.length - 1;
  $("next").textContent = idx === ACTS.length - 1 ? "完" : "下一幕";
}

$("prev").addEventListener("click", () => {
  if (idx > 0) {
    idx -= 1;
    paintStory();
  }
});
$("next").addEventListener("click", () => {
  if (idx < ACTS.length - 1) {
    idx += 1;
    paintStory();
  }
});

function paintMap() {
  $("map-grid").innerHTML = MAP.map(
    (m, i) => `
    <button type="button" class="map-node ${i === mapIdx ? "active" : ""}" data-i="${i}">
      <div class="k">${m.k}</div>
      <div class="t">${m.t}</div>
    </button>`
  ).join("");
  $("map-grid").querySelectorAll(".map-node").forEach((btn) => {
    btn.addEventListener("click", () => {
      mapIdx = Number(btn.dataset.i);
      paintMap();
    });
  });
  const m = MAP[mapIdx];
  $("map-detail").innerHTML = `
    <h3 class="detail-title">${m.title}</h3>
    <p>${m.why}</p>
    <ul class="files">
      ${m.files
        .map(
          (f) => `<li><div class="path">${f.path}</div><div class="why">${f.why}</div></li>`
        )
        .join("")}
    </ul>`;
}

function paintQuiz() {
  const item = QUIZ[quizIdx];
  quizLocked = false;
  $("quiz").innerHTML = `
    <div class="quiz-q"><p><strong>${quizIdx + 1}. ${item.q}</strong></p></div>
    <div class="quiz-opts">
      ${item.options
        .map(
          (o) =>
            `<button type="button" class="quiz-opt" data-id="${o.id}">${o.label}</button>`
        )
        .join("")}
    </div>
    <div id="quiz-fb" class="hidden"></div>`;
  $("quiz-score").textContent = `已答 ${quizAnswered} · 对 ${quizCorrect}`;
  $("quiz").querySelectorAll(".quiz-opt").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (quizLocked) return;
      quizLocked = true;
      quizAnswered += 1;
      const opt = item.options.find((o) => o.id === btn.dataset.id);
      const ok = Boolean(opt && opt.ok);
      if (ok) quizCorrect += 1;
      $("quiz").querySelectorAll(".quiz-opt").forEach((b) => {
        b.disabled = true;
        const o = item.options.find((x) => x.id === b.dataset.id);
        if (o.ok) b.classList.add("correct");
        if (b === btn && !ok) b.classList.add("wrong");
      });
      const fb = $("quiz-fb");
      fb.className = `quiz-fb ${ok ? "ok" : "bad"}`;
      fb.classList.remove("hidden");
      fb.innerHTML = `<strong>${ok ? "对" : "再看一眼"}。</strong> ${item.explain}`;
      $("quiz-score").textContent = `已答 ${quizAnswered} · 对 ${quizCorrect}`;
    });
  });
}

$("quiz-next").addEventListener("click", () => {
  quizIdx = (quizIdx + 1) % QUIZ.length;
  paintQuiz();
});

function paintScope() {
  $("scope-rail").innerHTML = SCOPE_STEPS.map(
    (_, i) => `<span class="${i <= scopeIdx ? "on" : ""}"></span>`
  ).join("");
  $("scope-acts").innerHTML = SCOPE_STEPS.map(
    (s, i) =>
      `<button type="button" class="act ${i === scopeIdx ? "active" : ""}" data-i="${i}">${s.tab}</button>`
  ).join("");
  $("scope-acts").querySelectorAll(".act").forEach((btn) => {
    btn.addEventListener("click", () => {
      scopeIdx = Number(btn.dataset.i);
      paintScope();
    });
  });
  const s = SCOPE_STEPS[scopeIdx];
  const gates =
    s.gates && s.gates.length
      ? `<div class="code-box"><h3>本步 Gate · 点开看含义</h3><div class="code-row">${s.gates
          .map(
            (g, i) => `
        <button type="button" class="code-item" data-g="${i}">
          <div class="file">${g.t}</div>
          <div class="role">gate</div>
          <div class="more">${g.d}</div>
        </button>`
          )
          .join("")}</div></div>`
      : "";
  const code = s.code
    .map(
      (c, i) => `
      <button type="button" class="code-item" data-c="${i}">
        <div class="file">${c.file}</div>
        <div class="role">${c.role}</div>
        <div class="more">${c.more}</div>
      </button>`
    )
    .join("");
  $("scope-stage").innerHTML = `
    <div class="num">${s.num}</div>
    <h2>${s.title}</h2>
    ${s.body}
    ${gates}
    <div class="code-box">
      <h3>源码入口 · 点开看干什么</h3>
      <div class="code-row">${code}</div>
    </div>`;
  $("scope-stage").querySelectorAll(".code-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      const open = btn.classList.contains("open");
      const group = btn.parentElement;
      group.querySelectorAll(".code-item").forEach((b) => b.classList.remove("open"));
      if (!open) btn.classList.add("open");
    });
  });
  $("scope-prev").disabled = scopeIdx === 0;
  $("scope-next").disabled = scopeIdx === SCOPE_STEPS.length - 1;
  $("scope-next").textContent = scopeIdx === SCOPE_STEPS.length - 1 ? "完" : "下一步";
}

$("scope-prev").addEventListener("click", () => {
  if (scopeIdx > 0) {
    scopeIdx -= 1;
    paintScope();
  }
});
$("scope-next").addEventListener("click", () => {
  if (scopeIdx < SCOPE_STEPS.length - 1) {
    scopeIdx += 1;
    paintScope();
  }
});

setMode("story");
</script>
