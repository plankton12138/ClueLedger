  <text x="570" y="74" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#15803d">作者确认</text>
  <text x="570" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#78716c">硬门：未确认禁写</text>

