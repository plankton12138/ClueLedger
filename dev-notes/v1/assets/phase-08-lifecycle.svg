  <path d="M 570 46 L 570 35 L 360 35 L 360 44" fill="none" stroke="#a8a29e" stroke-width="1.2" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>

  <text x="360" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#78716c">write_chapter 工具层预检：阶段未过「作者确认」即拒绝，错误消息含三要素</text>
