# Hastings 模型连接模板——复制为 config.yaml 并填入真实值（config.yaml 已被 git 忽略）。
#
# 模型来源只从这个文件读取：应用不读 OPENAI_API_KEY 这类进程环境变量，
# 换一台机器、换一个终端，行为都一样。
#
# 一个连接 = 作者自己的一个账号：端点 + 协议 + key + 可选模型。
# 通常不用手写这个文件：顶栏「模型设置」按「供应商 → 连接 → 模型」三步生成它。
# api_key 写一次即可：启动时转入系统凭据存储（Windows 凭据管理器 / macOS Keychain），
# 磁盘上只留 credential_ref。配好之后用 `uv run python scripts/check_model.py` 核对。

providers:
  # name 是稳定标识（改显示名不会变它），必须唯一
  - name: conn_example
    display_name: 我的 DeepSeek
    # 供应商预设：openai / deepseek / qwen / moonshot / zhipu / openrouter /
    # anthropic / google / custom；未知值按自定义服务展示
    catalog_id: deepseek
    base_url: https://api.deepseek.com/v1
    # 四类协议：openai-completions / openai-responses /
    # anthropic-messages / google-generative-ai
    api: openai-completions
    # 作者勾选为日常可用的模型；默认模型必须在其中
    models: [deepseek-flash, deepseek-v4-pro]
    default_model: deepseek-flash
    api_key: sk-xxxxxxxxxxxxxxxx
    # 已迁入系统凭据存储的旧文件只有这一行，没有 api_key：
    # credential_ref: hastings:provider:conn_example:1f3a9c02

# 当前选择（界面切换后由设置页写入；手写同样生效）
# active_provider: conn_example
# active_model: deepseek-flash
# selection_mode: explicit   # auto（默认）| explicit | none

