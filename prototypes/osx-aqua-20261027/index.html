<!doctype html>

  <title>线簿 · 经典 OS X Aqua 原型</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; color: #26333f; background: #e8edf2; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    body { margin: 0; }
    header { position: sticky; top: 0; z-index: 1; background: #f6f8fa; border-bottom: 1px solid #ccd4dc; }
    .bar { max-width: 1320px; margin: auto; padding: 18px 28px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; }
    nav { display: flex; gap: 20px; flex-wrap: wrap; margin-left: auto; }
    a { color: #2462a1; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #2673ce; outline-offset: 5px; }
    main { max-width: 1320px; margin: auto; padding: 28px; }
    .scope { margin: 0 0 30px; color: #596875; font-size: 14px; line-height: 1.8; }
    figure { margin: 0 0 48px; }
    figcaption { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
    h2 { font-size: 20px; margin: 0; }
    figcaption p { margin: 0; color: #596875; font-size: 14px; line-height: 1.8; }
    img { display: block; width: 100%; height: auto; border: 1px solid #bdc9d4; border-radius: 6px; box-shadow: 0 8px 28px #263c5020; }
    footer { color: #596875; font-size: 13px; padding: 0 0 24px; }
    @media (max-width: 660px) { .bar, main { padding: 18px 14px; } nav { margin-left: 0; font-size: 14px; gap: 16px; } figcaption { gap: 6px; } h1 { font-size: 17px; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>线簿 · 经典 OS X Aqua</h1>
      <nav aria-label="原型图导航">

        <a href="#clues">02 线索与原文</a>
        <a href="#library">03 模块库</a>
      </nav>
    </div>
  </header>
  <main>
